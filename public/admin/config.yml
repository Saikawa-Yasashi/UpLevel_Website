# yaml-language-server: $schema=https://unpkg.com/@sveltia/cms/schema/sveltia-cms.json

# Gallery order, titles, and media for Uplevel Carpentry.
# After deploying the free Sveltia CMS Authenticator Cloudflare Worker,
# set backend.base_url to that Worker URL (no trailing slash).

backend:
  name: github
  repo: Saikawa-Yasashi/UpLevel_Website
  branch: main
  base_url: https://sveltia-cms-auth.kacie-b49.workers.dev

# Default media root; per-album uploads use the nested media_folder below.
media_folder: public/gallery
public_folder: /gallery

collections:
  - name: gallery
    label: Gallery
    files:
      - name: order
        label: Album & photo order
        file: content/gallery-order.json
        format: json
        fields:
          - name: albums
            label: Albums
            label_singular: Album
            widget: list
            summary: "{{fields.title}} — {{fields.id}}"
            collapsed: true
            allow_add: true
            allow_remove: true
            allow_duplicate: false
            hint: Drag to reorder. Add or remove albums here. New album Folder ID should be a short code like 120 (creates/uploads under public/gallery/120/).
            fields:
              - name: id
                label: Album folder ID
                widget: string
                hint: Short folder name only (example 120 or kitchen-cabinets). No spaces. Used as the folder under public/gallery/.
                pattern: ["^[A-Za-z0-9][A-Za-z0-9_-]*$", "Use letters, numbers, hyphens, or underscores only (no spaces)."]
              - name: title
                label: Album title
                widget: string
                required: false
                hint: Shown at the top of this album on the Gallery page. Leave blank for no title.
              - name: media
                label: Photos & videos
                label_singular: Item
                widget: list
                summary: "{{fields.title}} — {{fields.src}}"
                thumbnail: src
                collapsed: true
                allow_add: true
                allow_remove: true
                allow_duplicate: false
                hint: Drag to reorder. Add photos/videos or remove items. Optional titles appear under each photo on the site.
                fields:
                  - name: src
                    label: Photo / video
                    widget: file
                    choose_url: false
                    accept: "image/*,.mp4,video/mp4"
                    media_folder: public/gallery/{{id}}
                    public_folder: /gallery/{{id}}
                    hint: Upload or choose a file for this album.
                  - name: title
                    label: Photo title
                    widget: string
                    required: false
                    hint: Shown under this photo on the Gallery page. Leave blank for no title.
